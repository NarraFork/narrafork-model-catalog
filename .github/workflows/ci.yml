name: Validate model data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test catalog validation rules
        run: python3 -m unittest discover -s .github -p 'test_validate_models.py' -v
      - name: Check one model per file and nested variants
        run: python3 .github/validate_models.py
