name: Publish immutable catalog
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: catalog-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify tag is the configured immutable version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e 'import c from "./catalog.config.json"; if (process.env.RELEASE_TAG !== `v${c.catalogVersion}`) throw new Error("Tag/catalog version mismatch")'
      - run: bun run check
      - run: git diff --exit-code -- schema/catalog.schema.json fixtures/resolution.json dist
      - name: Publish data artifacts without replacing any existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Versioned model metadata. Verify manifest SHA-256 before use. Reference data only; never billing or connection policy." dist/catalog.json dist/manifest.json dist/sha256sum.txt schema/catalog.schema.json fixtures/resolution.json
